<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#176A60" />
    <title>EzyCooking — Email Verified</title>

    <style>
      :root {
        --teal: #176a60;
        --teal-dark: #0f4a44;
        --card: rgba(255, 255, 255, 0.92);
        --text: #1a1a1a;
        --muted: #5c6f6c;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        background:
          radial-gradient(circle at top, #1f9c88 0%, transparent 60%),
          linear-gradient(165deg, var(--teal-dark), var(--teal), #1aa08c);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: var(--text);
      }

      .card {
        background: var(--card);
        border-radius: 28px;
        padding: 42px 26px 30px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .badge {
        width: 78px;
        height: 78px;
        margin: 0 auto 18px;
        border-radius: 50%;
        background: linear-gradient(145deg, #dff7f3, #bfece3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 34px;
        font-weight: bold;
        color: var(--teal);
        box-shadow: 0 10px 30px rgba(23, 106, 96, 0.25);
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
        100% {
          transform: scale(1);
        }
      }

      h1 {
        margin: 10px 0 10px;
        font-size: 1.5rem;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 0.98rem;
      }

      .btn {
        display: block;
        width: 100%;
        border: none;
        border-radius: 14px;
        padding: 16px 18px;
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(180deg, #1f8f7f, var(--teal));
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(23, 106, 96, 0.35);
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 30px rgba(23, 106, 96, 0.45);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .hint {
        margin-top: 18px;
        font-size: 0.82rem;
        color: var(--muted);
        line-height: 1.5;
      }

      .status {
        margin-top: 14px;
        font-size: 0.85rem;
        color: #2f6f66;
        opacity: 0.9;
      }

      .dots::after {
        content: "";
        display: inline-block;
        animation: dots 1.2s steps(4, end) infinite;
      }

      @keyframes dots {
        0% {
          content: "";
        }
        25% {
          content: ".";
        }
        50% {
          content: "..";
        }
        75% {
          content: "...";
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="badge">✓</div>

      <h1>Email verified</h1>

      <p>
        You’re all set 🎉<br />
        Open <strong>EzyCooking</strong> to continue your journey.
      </p>

      <button class="btn" id="openApp">Open EzyCooking</button>

      <div class="status">Redirecting to app<span class="dots"></span></div>

      <p class="hint">
        If nothing happens, tap the button above.<br />
        Make sure the app is installed on your device.
      </p>
    </div>

    <script>
      (function () {
        const appBase = "ezycooking://email-verify";
        const search = window.location.search || "";
        const hash = window.location.hash || "";
        const target = appBase + search + hash;

        function openApp() {
          window.location.href = target;
        }

        document.getElementById("openApp").addEventListener("click", openApp);

        // safer auto-open (avoids aggressive loops on desktop)
        const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
        if (isMobile) {
          setTimeout(openApp, 900);
        }
      })();
    </script>
  </body>
</html>
